<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOOKBOOK</title>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://rawcdn.githack.com/blasten/turn.js/master/turn.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            overflow: hidden;
        }

        /* Kontener, który przechwyci kliknięcia nad flipbookiem */
        #wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #flipbook .page {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #fff;
        }

        /* Niewidzialne strefy kliknięcia */
        .click-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            z-index: 999; /* Muszą być nad flipbookiem */
            cursor: pointer;
        }
        #left-zone { left: 0; }
        #right-zone { right: 0; }
    </style>
</head>
<body>

    <div id="wrapper">
        <div id="left-zone" class="click-zone"></div>
        <div id="right-zone" class="click-zone"></div>

        <div id="flipbook">
            <div class="page" style="background-image:url('pages/1.png');"></div>
            <div class="page" style="background-image:url('pages/2.png');"></div>
            <div class="page" style="background-image:url('pages/3.png');"></div>
            <div class="page" style="background-image:url('pages/4.png');"></div>
            <div class="page" style="background-image:url('pages/5.png');"></div>
        </div>
    </div>

    <script>
        $(window).ready(function() {
            function getBookSize() {
                var width = $(window).width();
                var height = $(window).height();
                var ratio = 1000 / 650;
                var bookW = width;
                var bookH = width / ratio;

                if (bookH > height) {
                    bookH = height;
                    bookW = height * ratio;
                }
                return { width: bookW, height: bookH };
            }

            var size = getBookSize();

            // Inicjalizacja flipbooka
            var flipbook = $("#flipbook");
            flipbook.turn({
                width: size.width,
                height: size.height,
                autoCenter: true,
                duration: 1000,
                gradients: true,
                acceleration: true,
                when: {
                    turning: function(e, page, view) {
                        // Można tu dodać dźwięk przewracania
                    }
                }
            });

            // NOWA LOGIKA KLIKNIĘCIA: Przechwytywanie przez przezroczyste divy
            $('#left-zone').on('click', function() {
                flipbook.turn('previous');
            });

            $('#right-zone').on('click', function() {
                flipbook.turn('next');
            });

            // Obsługa klawiatury
            $(window).bind('keydown', function(e) {
                if (e.keyCode == 37) flipbook.turn('previous');
                else if (e.keyCode == 39) flipbook.turn('next');
            });

            // Skalowanie przy zmianie rozmiaru okna
            $(window).resize(function() {
                var size = getBookSize();
                flipbook.turn('size', size.width, size.height);
            });
        });
    </script>

</body>
</html>
