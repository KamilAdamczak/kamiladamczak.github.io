<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lookbook | BRAND NAME</title>
    
    <!-- Biblioteki JQuery (wymagane dla Turn.js) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://rawcdn.githack.com/blasten/turn.js/master/turn.min.js"></script>

    <style>
        /* Estetyka a'la Takahiro Miyashita: Czerń, surowość, minimalizm */
        body {
            background-color: #0a0a0a;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        #flipbook-container {
            width: 90%;
            max-width: 1000px;
            height: 70vh;
        }

        #flipbook {
            width: 100%;
            height: 100%;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        /* Styl strony */
        #flipbook .page {
            width: 100%;
            height: 100%;
            background-color: #111;
            background-size: cover;
            background-position: center;
            border: 1px solid #222; /* Delikatna ramka jak w starym druku */
        }

        /* Tekst "Grain" w tle dla klimatu vintage */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.15;
            pointer-events: none;
        }

        .controls {
            position: fixed;
            bottom: 30px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 10px;
            cursor: pointer;
        }

        .controls:hover { color: #fff; }
    </style>
</head>
<body>

<div id="flipbook-container">
    <div id="flipbook">
        <!-- Tutaj dodajesz swoje strony (zdjęcia) -->
        <div class="page" style="background-image:url('pages/1.png');"></div>
        <div class="page" style="background-image:url('pages/2.png');"></div>
        <div class="page" style="background-image:url('pages/3.png');"></div>
        <div class="page" style="background-image:url('pages/4.png');"></div>
        <div class="page" style="background-image:url('pages/5.png');"></div>
    </div>
</div>

<div class="controls" onclick="$('#flipbook').turn('next')">Click to flip or use arrows</div>

<script>
    $(document).ready(function() {
        $("#flipbook").turn({
            width: 1000,
            height: 600,
            autoCenter: true,
            duration: 1000, // Czas przewracania (wolniejszy = bardziej filmowy)
            gradients: true,
            acceleration: true
        });
    });

    // Sterowanie strzałkami na klawiaturze
    $(window).bind('keydown', function(e) {
        if (e.keyCode == 37) $('#flipbook').turn('previous');
        else if (e.keyCode == 39) $('#flipbook').turn('next');
    });
</script>

</body>
</html>
