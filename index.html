<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOOKBOOK | RCKSTR3000</title>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://rawcdn.githack.com/blasten/turn.js/master/turn.min.js"></script>

    <style>
        /* Estetyka: Minimalizm, surowość, brak scrolla */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #fdfdfd; /* Bardzo jasny szary/off-white */
            color: #000;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header z wielkim napisem */
        header {
            padding: 40px 20px 10px 20px;
            text-align: center;
            z-index: 1001;
        }

        h1 {
            margin: 0;
            font-size: 8vw; /* Skaluje się z szerokością ekranu */
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -5px;
            line-height: 0.8;
        }

        /* Przycisk powrotu */
        .back-link {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: #000;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid #000;
            padding-bottom: 2px;
            transition: opacity 0.3s;
        }

        .back-link:hover {
            opacity: 0.5;
        }

        /* Główna sekcja z flipbookiem */
        #main-content {
            flex-grow: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        #flipbook-wrapper {
            position: relative;
            z-index: 5;
        }

        #flipbook .page {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-color: #fff;
        }

        /* Strefy kliknięcia */
        .click-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            z-index: 999;
            cursor: pointer;
        }
        #left-zone { left: 0; }
        #right-zone { right: 0; }

        /* Delikatne ziarno (Number Nine vibe) */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.08;
            pointer-events: none;
            z-index: 2000;
        }
    </style>
</head>
<body>

    <header>
        <h1>LOOKBOOK</h1>
        <a href="https://rckstr30000.bigcartel.com/" class="back-link">Back to store</a>
    </header>

    <div id="main-content">
        <div id="left-zone" class="click-zone"></div>
        <div id="right-zone" class="click-zone"></div>

        <div id="flipbook-wrapper">
            <div id="flipbook">
                <div class="page" style="background-image:url('pages/1.png');"></div>
                <div class="page" style="background-image:url('pages/2.png');"></div>
                <div class="page" style="background-image:url('pages/3.png');"></div>
                <div class="page" style="background-image:url('pages/4.png');"></div>
                <div class="page" style="background-image:url('pages/5.png');"></div>
            </div>
        </div>
    </div>

    <script>
        $(window).ready(function() {
            function getBookSize() {
                var containerW = $(window).width() * 0.9;
                var containerH = ($('#main-content').height()) * 0.85;
                
                var ratio = 1000 / 650; // Proporcja Twoich stron
                var bookW = containerW;
                var bookH = containerW / ratio;

                if (bookH > containerH) {
                    bookH = containerH;
                    bookW = containerH * ratio;
                }
                return { width: bookW, height: bookH };
            }

            var size = getBookSize();
            var flipbook = $("#flipbook");

            flipbook.turn({
                width: size.width,
                height: size.height,
                autoCenter: true,
                duration: 1000,
                gradients: true,
                acceleration: true
            });

            // Kliknięcia
            $('#left-zone').on('click', function() { flipbook.turn('previous'); });
            $('#right-zone').on('click', function() { flipbook.turn('next'); });

            // Klawiatura
            $(window).bind('keydown', function(e) {
                if (e.keyCode == 37) flipbook.turn('previous');
                else if (e.keyCode == 39) flipbook.turn('next');
            });

            // Skalowanie przy zmianie okna
            $(window).resize(function() {
                var size = getBookSize();
                flipbook.turn('size', size.width, size.height);
            });
        });
    </script>
</body>
</html>
