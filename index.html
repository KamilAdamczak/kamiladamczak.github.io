<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOOKBOOK</title>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://rawcdn.githack.com/blasten/turn.js/master/turn.min.js"></script>

    <style>
        /* Całkowity brak tła i marginesów */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent; /* Przezroczyste tło, jeśli używasz iframe */
            overflow: hidden;
        }

        #flipbook-container {
            cursor: pointer; /* Kursor sugerujący kliknięcie */
        }

        #flipbook {
            margin: 0 auto;
        }

        #flipbook .page {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: white; /* Tło samej kartki, jeśli zdjęcie się nie załaduje */
        }

        /* Opcjonalny efekt ziarna - jeśli go nie chcesz, usuń poniższy blok */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.05;
            pointer-events: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="flipbook-container">
        <div id="flipbook">
            <div class="page" style="background-image:url('pages/1.png');"></div>
            <div class="page" style="background-image:url('pages/2.png');"></div>
            <div class="page" style="background-image:url('pages/3.png');"></div>
            <div class="page" style="background-image:url('pages/4.png');"></div>
            <div class="page" style="background-image:url('pages/5.png');"></div>
        </div>
    </div>

    <script>
        $(window).ready(function() {
            function getBookSize() {
                var width = $(window).width();
                var height = $(window).height();
                
                // Skalowanie, by lookbook wypełniał okno, ale trzymał proporcje
                var ratio = 1000 / 650;
                var bookW = width;
                var bookH = width / ratio;

                if (bookH > height) {
                    bookH = height;
                    bookW = height * ratio;
                }

                return { width: bookW, height: bookH };
            }

            var size = getBookSize();

            $("#flipbook").turn({
                width: size.width,
                height: size.height,
                autoCenter: true,
                duration: 1000,
                gradients: true,
                acceleration: true
            });

            // LOGIKA KLIKNIĘCIA W LEWĄ/PRAWĄ STRONĘ
            $("#flipbook").bind("vclick", function(event) {
                var offset = $(this).offset();
                var relativeX = event.pageX - offset.left;
                var bookWidth = $(this).width();

                if (relativeX < bookWidth / 2) {
                    $('#flipbook').turn('previous');
                } else {
                    $('#flipbook').turn('next');
                }
            });

            // Obsługa klawiatury
            $(window).bind('keydown', function(e) {
                if (e.keyCode == 37) $('#flipbook').turn('previous');
                else if (e.keyCode == 39) $('#flipbook').turn('next');
            });

            // Responsywność
            $(window).resize(function() {
                var size = getBookSize();
                $('#flipbook').turn('size', size.width, size.height);
            });
        });
    </script>

</body>
</html>
